name: weekly-update

# Weekly rebuild of the FTS + XTS lot-testing dashboards. Runs on GitHub's
# infrastructure — no dependency on Marya's Mac being awake, no Claude
# routine plumbing, no MCP connectors. Everything auths via a Google Cloud
# service account (JSON key stored as the GDRIVE_SA_JSON secret) that has
# read access to the responses sheet + photos folder.
#
# Output flow: build_fts.py / build_xts.py write HTML files, then
# build_hub.py rebuilds index.html from templates/hub_template.html,
# pulling live lot/submission/detection-rate stats out of the two just-built
# dashboards so the hub's numbers never drift out of sync. This workflow
# then pushes all three files to the `gh-pages` branch. GitHub Pages serves
# that branch at https://padproject.info/test_strip_dashboard/ .

on:
  # Fridays at 20:00 America/Indianapolis. Cron uses UTC and does not do
  # DST, so we run two crons that cover both offsets (only one will
  # produce meaningful new data per week; the second will republish the
  # same content).
  schedule:
    - cron: '0 1 * * 6'   # Saturday 01:00 UTC = Friday 20:00 EST (winter)
    - cron: '0 0 * * 6'   # Saturday 00:00 UTC = Friday 20:00 EDT (summer)
  workflow_dispatch:       # manual "Run workflow" button, for testing

concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: write          # for git push of the rebuilt dashboards

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main (build tools + templates)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/gha/requirements.txt

      - name: Install ImageMagick (fallback photo processor for common.py)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Write service-account JSON from secret
        run: |
          mkdir -p .secrets
          printf '%s' "${GDRIVE_SA_JSON}" > .secrets/gdrive_sa.json
          chmod 600 .secrets/gdrive_sa.json
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}

      - name: Fetch FTS response sheet + photos from Google Drive
        run: |
          python3 scripts/gha/fetch_drive.py \
            --sheet-id '1Rlj5yWXoaa18aLsdI3L0Hri6RAq6MRvl6Rmxjycuo2Y' \
            --photo-column 12 \
            --photo-column 51 \
            --out-xlsx responses_fts.xlsx \
            --out-photos-dir photos_fts \
            --sa-json .secrets/gdrive_sa.json

      - name: Build FTS dashboard
        run: |
          mkdir -p _build
          python3 build_fts.py responses_fts.xlsx photos_fts _build/fts.html

      - name: Fetch XTS response sheet + photos from Google Drive
        run: |
          python3 scripts/gha/fetch_drive.py \
            --sheet-id '1qYtKDqcohHx9rJ3bx4wJ6injxoIY592twVzGwKtEzg4' \
            --photo-column 10 \
            --photo-column 71 \
            --out-xlsx responses_xts.xlsx \
            --out-photos-dir photos_xts \
            --sa-json .secrets/gdrive_sa.json

      - name: Build XTS dashboard
        run: |
          python3 build_xts.py responses_xts.xlsx photos_xts _build/xts.html

      - name: Fetch lot-intake response sheet from Google Drive
        run: |
          python3 scripts/gha/fetch_drive.py \
            --sheet-id '1iy-zC7mB6U6QjqG2jtnHPdQqfV3h7GM1veK3493K4IE' \
            --out-xlsx responses_intake.xlsx \
            --out-photos-dir photos_intake \
            --sa-json .secrets/gdrive_sa.json

      - name: Fetch lot-feedback response sheet from Google Drive
        run: |
          python3 scripts/gha/fetch_drive.py \
            --sheet-id '15wZHFE13Q77jpNlcT_8OOcwOkIridAiVprVV3Hqd6s4' \
            --out-xlsx responses_feedback.xlsx \
            --out-photos-dir photos_feedback \
            --sa-json .secrets/gdrive_sa.json

      - name: Build lot checking progress tracker
        run: |
          python3 build_progress.py responses_intake.xlsx responses_feedback.xlsx _build/fts.html _build/xts.html _build/progress.html

      - name: Build hub (live stats pulled from the dashboards above)
        run: |
          python3 build_hub.py _build/fts.html _build/xts.html _build/progress.html templates/hub_template.html _build/index.html

      - name: Wipe secret file before publish
        if: always()
        run: rm -f .secrets/gdrive_sa.json

      - name: Publish built dashboards to gh-pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Default checkout is shallow / main-only — fetch gh-pages first so
          # the worktree add below has a ref to point at.
          git fetch --depth=1 origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages-worktree gh-pages
          cp _build/*.html /tmp/gh-pages-worktree/
          cd /tmp/gh-pages-worktree
          git add fts.html || true
          git add xts.html || true
          git add progress.html || true
          git add index.html || true
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "weekly-update: rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin gh-pages
          fi
